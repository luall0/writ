[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
# Every `unsafe` block says why it is sound, on the line above (`// SAFETY: …`).
undocumented_unsafe_blocks = "deny"
# A panic on hostile input is a denial of service: index, slice and cast only where the
# bound is checked, with `.get()`, or with an `#[allow]` that says why it can't fail.
indexing_slicing = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"

[profile.dev]
# Line tables only: backtraces keep file and line, builds are faster and target/ smaller
# (docs/testing.md#how-make-test-runs). CARGO_PROFILE_DEV_DEBUG=full for a debugger session.
debug = "line-tables-only"

[profile.release]
# An overflow is a crash, never a wrapped value in a limit or a counter.
overflow-checks = true

[workspace.dependencies]
writ-alloc = { path = "crates/writ-alloc" }
writ-core = { path = "crates/writ-core" }
writ-crypto = { path = "crates/writ-crypto" }
writ-gateway = { path = "crates/writ-gateway" }
writ-store = { path = "crates/writ-store" }
writ-platform = { path = "crates/writ-platform" }
writ-platform-linux = { path = "crates/writ-platform-linux" }
writ-platform-macos = { path = "crates/writ-platform-macos" }
writ-proto = { path = "crates/writ-proto" }
writ-approval = { path = "crates/writ-approval" }
writ-git = { path = "crates/writ-git" }
writ-signer = { path = "crates/writ-signer" }
writ-mirror = { path = "crates/writ-mirror" }

age = { version = "0.11.2", default-features = false }
# RSA keys of the software signer (generated, PKCS#8, signed in constant time): the `rsa` crate
# is banned (deny.toml). `ring-io` reads a public key's modulus and exponent.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "alloc", "ring-io"] }
# The fake recipient of the keystore's tests (one more recipient, no change to the keystore):
# age's own stanza and file key types, already in the tree.
age-core = { version = "0.11.0", default-features = false }
anyhow = "1.0.104"
# The keystore's age X25519 identity from the 32-byte data key (age's own encoding, already in
# the tree through age).
bech32 = "0.9.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# The guided prompts of `writ` on a terminal (M7.9.5): select, multi-select, validated text,
# confirm. crossterm alone: no fuzzy matcher (a typed answer filters by plain substring).
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
# `zeroize`: rcgen's copy of a key pair can be wiped (the reader's client certificate).
# P-256 points checked on the curve (a helper's answer, writ_signer::helper): already in the
# tree through ssh-key, with the same features.
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto", "zeroize"] }
# Parses the client certificate of a reader key (the HTTPS approval API); already rustls's.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# The authority versions' MAC (HMAC-SHA-256), keyed by a sealed secret; already in the tree.
hmac = "0.12.1"
globset = { version = "0.4.21", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
proptest = "1.12.0"
# Safe wrappers over the Unix calls the private-file checks need (open without following a
# link, the effective uid), and the terminal's echo, off while a passphrase is typed; already
# in the tree (tempfile).
# macOS calls rustix has no wrapper for (`ptrace`, `proc_pidinfo`), in writ-platform-macos's one
# `unsafe` module. Already in the tree (tokio, rustix's libc backend).
libc = "0.2.191"
# The constants of the Linux calls writ-platform-linux makes through libc that libc doesn't
# name for glibc yet (`SO_PEERPIDFD`), per architecture; already in the tree (rustix).
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net"] }
core-foundation-sys = { version = "0.8.7", default-features = false, features = ["link"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std", "termios"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# Deserialization only: no `include` (files), no `properties` (variable interpolation).
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
# No `flate2`: compression is never offered (RFC 4253 `zlib` decompresses before
# authentication, and git packs are compressed already). Algorithms are listed explicitly in
# the gateway, never left to the library's defaults.
russh = { version = "0.65.0", default-features = false, features = ["ring"] }
# Pinned to the exact version russh uses, so certificates and keys are the same types.
ssh-key = { version = "=0.7.0-rc.11", features = ["alloc", "std", "ed25519", "p256", "p384", "getrandom"] }
sha2 = "0.10.9"
# SHA-1 with collision detection (the algorithm of git's sha1dc): object ids of SHA-1 repos,
# computed from objects an agent sends.
sha1-checked = { version = "0.10.0", default-features = false, features = ["std"] }
signature = "3.0.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs", "signal"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
