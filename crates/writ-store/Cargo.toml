[package]
name = "writ-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test support (a breakable audit log, an in-memory store, the secret scan), for the tests
# of this crate and of others.
testing = []

[dependencies]
writ-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests use the test support: always build it with `testing`.
writ-store = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
