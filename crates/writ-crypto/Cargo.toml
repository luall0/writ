[package]
name = "writ-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A software P-256 key-agreement key standing for hardware (`piv_p256::software`), for the
# tests of this crate and of others.
testing = []

[dependencies]
# Sealing a token to the daemon keystore's recipient (`writ admin token`).
age.workspace = true
# The piv-p256 stanza (M7.6): age's own HKDF and ChaCha20-Poly1305, its file key and stanza.
age-core.workspace = true
aws-lc-rs.workspace = true
base64ct.workspace = true
# v4 OpenPGP fingerprints (SHA-1, over the daemon's own key packets); already in the tree.
sha1-checked.workspace = true
hmac.workspace = true
# A hardware key-agreement key's public point, the piv-p256 ECDH (M7.6); in the tree already.
p256.workspace = true
bech32.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
rustix.workspace = true
sha2.workspace = true
signature.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
writ-crypto = { workspace = true, features = ["testing"] }

[lints]
workspace = true
