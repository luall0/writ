[package]
name = "writ-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# macOS-only implementations of the platform interfaces. On another OS the crate is empty.

[target.'cfg(target_os = "macos")'.dependencies]
writ-platform.workspace = true
writ-core.workspace = true
# The Unix socket transport's peer reader (a tokio UnixStream).
tokio.workspace = true
tracing.workspace = true
# Security.framework's code signatures, in the `unsafe` module (`sys::codesign`).
core-foundation-sys.workspace = true
# The core limit (`process`).
rustix = { workspace = true, features = ["process"] }
# `ptrace(PT_DENY_ATTACH)` and `proc_pidinfo`, in the one `unsafe` module (`sys`).
libc.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
writ-platform = { workspace = true, features = ["testing"] }
# The Secure Enclave helper's tests: the Signer contract on the real Secure Enclave.
writ-signer = { workspace = true, features = ["testing"] }
writ-crypto.workspace = true
# The keystore's hardware recipient on the real Secure Enclave (M7.6): its shared secret.
zeroize.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
