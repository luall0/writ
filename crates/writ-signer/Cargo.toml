[package]
name = "writ-signer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test support (a signer that can be made to fail, the contract suite every backend runs),
# for the tests of this crate and of others.
testing = []

# A fake `writ-se` for the helper signer's tests: never shipped.
[[bin]]
name = "writ-fake-se"
path = "src/bin/writ-fake-se.rs"
required-features = ["testing"]

[dependencies]
writ-core.workspace = true
writ-crypto.workspace = true
p256.workspace = true
# The digest framing a helper's blob (helper::frame).
sha2.workspace = true
signature.workspace = true
ssh-key.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
rustls.workspace = true
# A directory for `ssh-keygen -Y verify`'s allowed signers and signature.
tempfile.workspace = true
# The tests use the test support: always build it with `testing`.
writ-signer = { workspace = true, features = ["testing"] }
# The helper's key agreement as a way into the keystore: the unwrap contract (M7.6).
writ-platform = { workspace = true, features = ["testing"] }
# Reads what the queue logs (a backend that panicked).
tracing-subscriber.workspace = true

[lints]
workspace = true
