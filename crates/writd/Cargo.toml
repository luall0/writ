[package]
name = "writd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The unencrypted dev keystore (tests and development only). Even with it, a release build
# refuses it; without it, any build does. Never enabled in a shipped build.
dev-keystore = []
# The system allocator, without wiping: the baseline of M5.7's benchmark only
# (docs/history/m5.7-memory-wiped-on-free.md). Never enabled in a shipped build.
system-allocator = []

[dependencies]
writ-alloc.workspace = true
writ-approval.workspace = true
writ-core.workspace = true
writ-crypto.workspace = true
writ-gateway.workspace = true
writ-platform.workspace = true
writ-proto.workspace = true
writ-mirror.workspace = true
writ-signer.workspace = true
writ-store.workspace = true
age.workspace = true
anyhow.workspace = true
serde.workspace = true
ssh-key.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

# Each platform's implementations, picked in src/platform.rs.
[target.'cfg(target_os = "linux")'.dependencies]
writ-platform-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
writ-platform-macos.workspace = true

[dev-dependencies]
# The count of blocks wiped: the test that proves the global allocator is the wiping one.
writ-alloc = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# A cheap scrypt work factor for the keystore's tests (`enroll_with_work_factor`), and a
# fake way into it standing for hardware (`FakeUnwrap`).
writ-platform = { workspace = true, features = ["testing"] }
# A throwaway certificate (`tls::generate_self_signed`, test support since the TLS key moved
# behind the `Signer`).
writ-crypto = { workspace = true, features = ["testing"] }

[lints]
workspace = true
