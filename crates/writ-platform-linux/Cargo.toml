[package]
name = "writ-platform-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Linux-only implementations of the platform interfaces. On another OS the crate is empty.

[target.'cfg(target_os = "linux")'.dependencies]
writ-platform.workspace = true
# Limits, not dumpable (`process`), `mlockall` (`mm`), the effective capabilities (`thread`).
rustix = { workspace = true, features = ["mm", "process", "thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
writ-platform = { workspace = true, features = ["testing"] }

[lints]
workspace = true
