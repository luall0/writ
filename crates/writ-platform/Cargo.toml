[package]
name = "writ-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fakes of every interface and the contract suites, for tests of this crate and of others.
testing = ["writ-crypto/testing"]

[dependencies]
writ-core.workspace = true
# The piv-p256 stanza a hardware key-agreement key unwraps (M7.6).
writ-crypto.workspace = true
age.workspace = true
age-core.workspace = true
bech32.workspace = true
rustix.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The tests run the fakes and the contract suites: always build them with `testing`.
writ-platform = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# Paused time: retries with a backoff are tested without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
