[package]
name = "writ-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only: the crates and binaries working together, with the real local tools (git,
# OpenSSH) and no external service. Nothing depends on this crate.

[dependencies]
# The benchmark's switchable allocator (tests/alloc_bench.rs, M5.7).
writ-alloc = { workspace = true, features = ["testing"] }
writ-approval = { workspace = true, features = ["testing"] }
writ-core.workspace = true
writ-crypto.workspace = true
writ-gateway.workspace = true
writ-git.workspace = true
writ-mirror = { workspace = true, features = ["testing"] }
writ-platform = { workspace = true, features = ["testing"] }
writ-proto.workspace = true
writ-signer = { workspace = true, features = ["testing"] }
writ-store = { workspace = true, features = ["testing"] }
base64ct.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
russh.workspace = true
# A pseudo-terminal for the commands that ask (terminal.rs): the same on Linux and macOS.
rustix = { workspace = true, features = ["pty"] }
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
ureq.workspace = true

[dev-dependencies]
# Paused time: a deadline is tested without waiting for it.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
