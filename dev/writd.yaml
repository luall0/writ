# The development daemon (`make run`): test keys and test repos only.
# Before the first run, put your approval public key in dev/approvers (gitignored):
#   echo "me $(cat ~/path/to/approval-key.pub)" > dev/approvers
state_dir: data                  # dev/data, gitignored: leases, audit log, repos, keys
policy: policy.yaml
approvers: approvers
readers: readers                 # dev/readers, gitignored: written by `make dev-client`
decisions: signed                # signed | open (refusals and revocations)
keystore: { dev: data/keys }     # unencrypted, refused by release builds (sealed keystore: M5)
mirrors:
  known_hosts: upstream_known_hosts   # the remotes' host keys, pinned by hand
  # ca_certs: upstream_ca.pem     # https:// upstreams: the CAs trusted (default: the system's);
  #                               # their tokens alone in data/keys/tokens/<id>, mode 0600
  # git: /usr/bin/git             # git (absolute path; 2.45, or 2.47 for https://)
  # ssh: /usr/bin/ssh             # the OpenSSH client (absolute path)
  # fresh_for: 10s, sync_every: 5m, timeout: 5m, max_fetch: 1GiB  (the defaults)
transports:
  agents: [{ tcp: "127.0.0.1:2222", allow: [127.0.0.1] }]   # who may connect (required on TCP)
  approvals:                     # the approval API; [] disables one, not both
    ssh: [{ tcp: "127.0.0.1:2223" }]
    https: [{ tcp: "127.0.0.1:8443" }]   # pin `writd tls-fingerprint dev/writd.yaml` in ~/.writ/tls_pins
attestor: network
session_watcher: none
notifiers: []
# notifiers:
#   - telegram: { token: { boot: telegram-token }, chat_id: "123456789" }   # token file mode 0600, gitignored
