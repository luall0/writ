# The development policy: one throwaway repo, one template.
repos:
  demo:
    upstream: ssh://git@remote.invalid/demo.git
    upstream_credential: upstream-dev-01
    protected_refs: ["refs/heads/main", "refs/tags/*"]
    ticket_link: trailer             # each commit carries `Writ: <lease id>` (the manual checks)
templates:
  feature-branch:
    repos: [demo]
    operations: [fetch, commit_sign, push]
    branches: ["agent/*"]
    committer_emails: ["agent@writ.invalid"]
    committer_name: "Writ agent 1"
    signing_key: agent-dev-01
    max_ttl: 4h
    max_signatures: 50
    max_pushes: 30
    max_ops_per_minute: 20
    max_push_size: 50MB
