# cargo-nextest, the runner of `make test` (docs/testing.md#how-make-test-runs).
# The pinned version (docs/stack.md): an older one refuses to run.
nextest-version = { required = "0.9.151" }

[profile.default]
# Never retried: a test that passes on a second try passes by luck (docs/testing.md#hardened-tests).
retries = 0
# Every failure is reported, not only the first one.
fail-fast = false
# A test still running after five minutes is killed and fails: a hang never holds the run.
slow-timeout = { period = "60s", terminate-after = 5 }
