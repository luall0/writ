# The end-to-end daemon (docs/end-to-end.md): the operator's writd.yaml, with paths relative
# to it, installed and started by the operator setup (crates/writ-e2e/src/setup.rs) in the
# writd container's home. Test keys and the throwaway Forgejo only.
state_dir: data
policy: policy.yaml
approvers: approvers
readers: readers
decisions: signed
# Every scenario's agent submits from the agent container: one source address.
max_pending: 50
submissions: { per_source: 300, in_all: 600 }
# The expiry scenario waits for an unsigned ticket to expire: 30 seconds, not the default 5
# minutes (docs/end-to-end.md).
min_ttl: 30s
keystore: { sealed: { dir: data/keys, boot: data/boot } }   # made by `writd init`, opened by `writ unseal`
mirrors:
  known_hosts: upstream_known_hosts
  ca_certs: upstream_ca.pem        # the HTTPS front's certificate (the `https` repo)
  fresh_for: 0s                    # every fetch and push asks Forgejo first
transports:
  agents: [{ tcp: "0.0.0.0:2222", allow: ["0.0.0.0/0"] }]
  approvals:
    ssh: [{ tcp: "0.0.0.0:2223" }]
    https: [{ tcp: "0.0.0.0:8443" }]
attestor: network
session_watcher: none
notifiers: []
