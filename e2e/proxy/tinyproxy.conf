# tinyproxy, the end-to-end HTTP proxy (scenario 25): CONNECT with Basic authentication, to the
# HTTPS front's port only, on both networks: it alone reaches `forgejo-https-behind`.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 100
DisableViaHeader Yes
ConnectPort 3443
BasicAuth writ e2e-http-proxy-password
