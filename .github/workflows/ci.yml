# CI: `make ci`, the one definition of green, on Linux, then the property tests with a random
# seed. macOS-only code is tested by the same target on the Mac, which the pre-push hook
# requires (`make hooks`). And `make e2e`, the
# end-to-end pipeline (docs/end-to-end.md), as a job of its own: Docker on the runner, the
# images pinned by digest in e2e/. No third-party action is used: the repository is fetched
# with git and the job's read-only token, so nothing outside this repo, GitHub's runner image
# and those pinned images runs here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraHeader=Authorization: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: cargo-deny (pinned)
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: cargo-nextest (pinned)
        run: cargo install --locked cargo-nextest --version 0.9.151

      - name: Tools the integration tests use
        run: |
          command -v nc || sudo apt-get install -y netcat-openbsd
          git --version
          ssh -V

      - name: make ci
        run: make ci

      # New inputs on every push (docs/testing.md#property-tests): a failure prints its seed,
      # replayed locally with `make test-props SEED=<seed>`.
      - name: Property tests with a random seed
        run: make test-props SEED=random

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch the commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraHeader=Authorization: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Docker
        run: |
          docker version
          docker compose version

      - name: make e2e
        run: make e2e
